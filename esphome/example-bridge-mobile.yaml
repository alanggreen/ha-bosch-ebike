# Mobile / roaming Bosch eBike LDI bridge: MQTT + multi-WiFi + WireGuard.
#
# This is an ADDITION to the standard example-bridge.yaml (which uses the
# native API). Use this variant only if you want to take the bridge ALONG on
# a ride (e.g. an ESP32-C3 on a powerbank in the frame bag) and still get the
# data into your Home Assistant at home.
#
# How it works on the road:
#   eBike --BLE--> ESP --WiFi(phone hotspot)--> Internet --WireGuard--> home
#   --MQTT--> Home Assistant
#
# Why MQTT and not the native API:
#   With the native API, HOME ASSISTANT opens the connection to the ESP and
#   must know its IP. On the road that IP keeps changing (hotspot DHCP /
#   tunnel IP), so HA loses the device. With MQTT the ESP PUSHES its data to
#   the broker, so a changing IP no longer matters.
#
# Full setup guide (FritzBox WireGuard, iPhone hotspot setting, entity
# changes when moving from API to MQTT): see MOBILE.md next to this file.
#
# All personal values (WiFi, hotspot, MQTT, WireGuard incl. the assigned IP)
# live in secrets.yaml. Copy secrets.yaml.example to secrets.yaml and fill it
# in. Never commit secrets.yaml.

substitutions:
  # Used inside the SSID-gating lambda further down. A lambda cannot read
  # !secret directly, so we pull the hotspot SSID into a substitution here.
  # This MUST match your hotspot SSID exactly.
  hotspot_ssid: !secret hotspot_ssid

esphome:
  name: ebike-bridge-mobile
  friendly_name: eBike Bridge Mobile
  min_version: 2025.11.0
  # Set to true if you run more than one bridge, so the node name / MQTT
  # client id stay unique.
  name_add_mac_suffix: false

esp32:
  # Classic ESP32 (ESP32-DevKit / "NodeMCU-32S" 30-pin board with an
  # ESP-WROOM-32 module). For an ESP32-C3 instead, use variant: esp32c3 /
  # board: esp32-c3-devkitm-1, drop the three CONFIG_BTDM_* lines and change
  # the ride_data_logger pins below.
  variant: esp32
  # board: esp32dev pins PlatformIO to the standard ESP32-DevKitC defaults
  # (see factory.yaml for why this matters for WiFi stability).
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      # The SD-card log needs folder support (mkdir/opendir/stat); ESPHome switches
      # it off by default.
      disable_vfs_support_dir: false
    sdkconfig_options:
      CONFIG_BT_ENABLED: y
      # Task watchdog: 15 s instead of 5 s, so a slow SD write or network stall
      # does not restart the ESP in the middle of a ride.
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "15"
      CONFIG_BT_NIMBLE_ENABLED: y
      CONFIG_BT_BLUEDROID_ENABLED: n
      CONFIG_BT_CONTROLLER_ENABLED: y
      CONFIG_BTDM_CTRL_MODE_BLE_ONLY: y
      CONFIG_BTDM_CTRL_MODE_BR_EDR_ONLY: n
      CONFIG_BTDM_CTRL_MODE_BTDM: n
      CONFIG_BT_NIMBLE_MAX_CONNECTIONS: "2"  # bike + phone
      CONFIG_BT_NIMBLE_ROLE_PERIPHERAL: y
      CONFIG_BT_NIMBLE_ROLE_BROADCASTER: y
      CONFIG_BT_NIMBLE_ROLE_CENTRAL: y
      CONFIG_BT_NIMBLE_ROLE_OBSERVER: y
      CONFIG_BT_NIMBLE_SM_LEGACY: n
      CONFIG_BT_NIMBLE_SM_SC: y
      CONFIG_BT_NIMBLE_NVS_PERSIST: y
      CONFIG_BT_NIMBLE_ATT_PREFERRED_MTU: "247"

logger:
  level: INFO
  logs:
    bosch_ebike_ldi: INFO
    wireguard: INFO
    mqtt: INFO

ota:
  - platform: esphome
    # Without a password anyone on the network can replace the firmware.
    password: !secret ota_password

# --- MQTT (replaces the native api:) ----------------------------------------
# IMPORTANT: do NOT enable api: at the same time, or the device shows up
# twice in HA (once via the ESPHome integration, once via MQTT discovery).
# For roaming, MQTT is the one to keep.
#
# NOTE: do NOT add `idf_send_async: true` on the ESP32-C3. In testing it
# caused the MQTT client to disconnect and reconnect roughly every 30 s.
# (ride_data_logger below works with or without it - its delivery guarantee
# comes from its own acknowledgements, not from the MQTT client.)
mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  username: !secret mqtt_user
  password: !secret mqtt_password
  discovery: true
  # 15 s (the default) is too tight for a path through a router and a VPN: one
  # stalled second makes the broker drop the session ("exceeded timeout").
  keepalive: 60s
  # Do not copy every log line to the broker (leaks SSID/IP and adds traffic).
  log_topic:
  discovery_prefix: homeassistant
  # Let only the WiFi reboot_timeout below trigger reboots, not MQTT.
  reboot_timeout: 0s

wifi:
  power_save_mode: none
  # With multiple networks, do NOT use fast_connect (it would only ever try
  # the first network and never fall back).
  # NEVER reboot just because there is no WiFi. This bridge rides away from any
  # network for hours; a reboot after 5 min would drop the bike connection, stop
  # recording and lose the clock. (0s = disabled; the WiFi still reconnects by itself.)
  reboot_timeout: 0s

  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 10
    - ssid: !secret hotspot_ssid
      password: !secret hotspot_password
      priority: 5

  ap:
    ssid: "eBike Bridge Mobile Setup"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80
  version: 3
  auth:
    username: ebike
    password: !secret web_password

# WireGuard requires a time source.
time:
  - platform: sntp
    id: sntp_time
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org

# --- WireGuard tunnel back to the home network ------------------------------
# All values come from the WireGuard connection you create in your router
# (e.g. a FritzBox). See MOBILE.md for the step-by-step and where each value
# maps to. Pitfalls we hit (already handled here):
#   - `address` MUST equal the IP the router assigned to this peer.
#   - `netmask: 255.255.255.0` is what actually routes the home subnet
#     through the tunnel (do not omit it).
#   - `require_connection_to_proceed: false` is required, because at home we
#     disable the tunnel (see below); requiring it would block startup.
wireguard:
  id: wg_tunnel
  address: !secret wg_address
  netmask: 255.255.255.0
  private_key: !secret wg_private_key
  peer_endpoint: !secret wg_endpoint
  peer_port: !secret wg_port
  peer_public_key: !secret wg_peer_public_key
  peer_preshared_key: !secret wg_preshared_key
  peer_allowed_ips:
    - !secret wg_allowed_subnet
  peer_persistent_keepalive: 25s
  reboot_timeout: 0s
  require_connection_to_proceed: false

# Turn the tunnel ON only on the phone hotspot, and OFF at home. At home the
# router assigns the peer an IP inside the home subnet, so an active tunnel
# there would create a routing conflict.
text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset reason"
  - platform: wifi_info
    ssid:
      name: "WLAN SSID"
      id: current_ssid
      on_value:
        then:
          - if:
              condition:
                lambda: 'return x == "${hotspot_ssid}";'
              then:
                - logger.log: "Hotspot detected -> enabling WireGuard"
                - wireguard.enable:
                    id: wg_tunnel
              else:
                - logger.log: "Home network detected -> disabling WireGuard"
                - wireguard.disable:
                    id: wg_tunnel

external_components:
  - source:
      type: local
      path: components
    components: [bosch_ebike_ldi, ride_data_logger]

bosch_ebike_ldi:
  id: ebike_bridge
  phone_link: true  # GATT service for the Android app (press "eBike Pair phone" once)
  device_name: "HA eBike Bridge"

# --- Ride data logging while offline ----------------------------------------
# Every sample is written to the microSD card FIRST, then sent over MQTT, and
# only deleted from the card once Home Assistant has acknowledged storing it.
# So a dead zone, hotspot drop, tunnel hiccup, broker restart or even a power
# cut loses nothing; the backlog is replayed oldest-first on reconnect, and
# every record carries a unique id so Home Assistant drops any resend (no
# duplicates). If the card fills up, the OLDEST unacknowledged samples are
# overwritten so recording never stops.
# Home Assistant side: enable `offline_backfill` for the ha_bosch_ebike
# integration (see RIDE_LOGGING.md) - it stores the samples and sends the acks.
#
# SD module wiring (standard 6-pin SPI microSD adapter -> classic ESP32 VSPI):
#   VCC -> 3V3 (or 5V if the module has an onboard regulator, check yours)
#   GND -> GND,  CS -> GPIO5,  MOSI -> GPIO23,  MISO -> GPIO19,  SCK -> GPIO18
# Adjust the pins to how you wired it. Avoid GPIO6-11 (flash) and GPIO34-39
# (input only). Card must be FAT32.
ride_data_logger:
  id: ride_logger
  phone_link: ebike_bridge
  cs_pin: GPIO5
  mosi_pin: GPIO23
  miso_pin: GPIO19
  clk_pin: GPIO18
  time_id: sntp_time
  # Optional: authenticate acks from Home Assistant (set the SAME value as
  # `ack_secret` under offline_backfill in configuration.yaml, or leave both off):
  # ack_secret: !secret ride_ack_secret
  record_when: connected_sensor   # only log while the bike is connected
  # Defaults shown for reference:
  # replay_topic: ebike-bridge-mobile/ride_log        # <node name>/ride_log
  # ack_topic: ebike-bridge-mobile/ride_log/ack
  # sample_interval: 2s
  # max_log_bytes: 16777216   # ring-buffer size on the card (~160 h at 2 s)
  sensors:
    - id: speed_sensor
      key: "speed"
    - id: cadence_sensor
      key: "cadence"
    - id: rider_power_sensor
      key: "rider_power"
    - id: ambient_brightness_sensor
      key: "ambient_brightness"
    - id: batt_soc
      key: "battery_soc"
    - id: odometer_sensor
      key: "odometer"
  binary_sensors:
    - id: connected_sensor
      key: "connected"
    - id: light_sensor
      key: "light"
    - id: system_locked_sensor
      key: "system_locked"
    - id: charger_conn
      key: "charger_connected"
    - id: light_reserve_sensor
      key: "light_reserve"
    - id: diagnosis_active_sensor
      key: "diagnosis_active"
    - id: in_motion_sensor
      key: "in_motion"

# Why did the ESP last restart? (brown-out, watchdog, crash, power-on ...)
# Shown in Home Assistant as "Reset reason" and in the log at every boot.
debug:
  update_interval: 60s

# Status LED (the blue LED on the ESP32 devkit, GPIO2):
#   tiny tick / 5 s   = powered and idle: bike not connected, nothing is being recorded
#   (completely dark  = no power / dead board)
#   short blink / 2 s = bike connected, samples are being written to the card
#   fast flicker      = problem: no usable SD card, or card writes are failing
output:
  - platform: gpio
    pin: GPIO2
    id: status_led_out

interval:
  - interval: 100ms
    then:
      - lambda: |-
          static uint32_t tick = 0;
          tick++;
          bool on = false;
          switch (id(ride_logger).led_state()) {
            case 1: on = (tick % 20) < 2; break;   // 200 ms on, 1.8 s off
            case 2: on = (tick % 2) == 0; break;   // 5 Hz flicker
            default: on = (tick % 50) == 0;       // idle: tiny tick every 5 s = "powered, waiting for the bike"
          }
          if (on) id(status_led_out).turn_on(); else id(status_led_out).turn_off();

# Charge-time estimate: while charging, measure the charging rate (%/min) from
# the rising SoC and extrapolate the remaining time to 80 % and to 100 %. Two
# fixed targets so the charge limit set in the Flow app does not need to be read.
globals:
  - id: chg_rate          # smoothed charging rate in %/min, -1 = unknown
    type: float
    restore_value: no
    initial_value: '-1'
  - id: chg_last_soc      # last SoC reference point
    type: float
    restore_value: no
    initial_value: '-1'
  - id: chg_last_ms       # timestamp (millis) of the last SoC reference point
    type: uint32_t
    restore_value: no
    initial_value: '0'

sensor:
  # Logger state for Home Assistant: 0 = idle (bike not connected), 1 = recording to the
  # card, 2 = PROBLEM (no usable SD card, or card writes failing). Same as the LED.
  - platform: template
    name: "eBike Logger State"
    id: logger_state
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      return id(ride_logger).led_state();
  - platform: bosch_ebike_ldi
    bosch_ebike_ldi_id: ebike_bridge
    speed:
      name: "eBike Speed"
      id: speed_sensor
    cadence:
      name: "eBike Cadence"
      id: cadence_sensor
    rider_power:
      name: "eBike Rider Power"
      id: rider_power_sensor
    ambient_brightness:
      name: "eBike Ambient Brightness"
      id: ambient_brightness_sensor
      # This value updates ~2x per second. Throttle it to one (averaged)
      # value per 30 s to spare WiFi, MQTT and the WireGuard tunnel.
      filters:
        - throttle_average: 30s
    battery_soc:
      name: "eBike Battery SoC (Live)"
      id: batt_soc
      on_value:
        - lambda: |-
            if (!id(charger_conn).state || std::isnan(x)) return;
            if (id(chg_last_soc) < 0) {
              id(chg_last_soc) = x; id(chg_last_ms) = millis(); return;
            }
            float dsoc = x - id(chg_last_soc);
            if (dsoc >= 1.0f) {
              float dmin = (millis() - id(chg_last_ms)) / 60000.0f;
              if (dmin > 0.01f) {
                float r = dsoc / dmin;
                if (r > 0)
                  id(chg_rate) = (id(chg_rate) < 0) ? r
                                                    : (0.3f * r + 0.7f * id(chg_rate));
              }
              id(chg_last_soc) = x;
              id(chg_last_ms) = millis();
            }
    odometer:
      name: "eBike Odometer (Live)"
      id: odometer_sensor

  # Estimated remaining charging time (minutes). NAN -> "unknown" until a
  # reliable rate has built up. 80 % stays in the linear CC region (accurate);
  # 100 % adds a slowdown factor for the CV tail.
  - platform: template
    name: "eBike Charge Time to 80% (Estimate)"
    id: chg_eta_80
    unit_of_measurement: "min"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      if (!id(charger_conn).state) return NAN;
      float soc = id(batt_soc).state;
      float rate = id(chg_rate);
      if (rate <= 0 || std::isnan(soc) || soc >= 80.0f) return NAN;
      return (80.0f - soc) / rate;
  - platform: template
    name: "eBike Charge Time to 100% (Estimate)"
    id: chg_eta_100
    unit_of_measurement: "min"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      if (!id(charger_conn).state) return NAN;
      float soc = id(batt_soc).state;
      float rate = id(chg_rate);
      if (rate <= 0 || std::isnan(soc) || soc >= 100.0f) return NAN;
      const float cv_start = 85.0f, cv_factor = 2.5f;
      float mins = 0.0f, s = soc;
      if (s < cv_start) { mins += (cv_start - s) / rate; s = cv_start; }
      mins += (100.0f - s) / (rate / cv_factor);
      return mins;

binary_sensor:
  - platform: wireguard
    status:
      name: "WireGuard Status"
      id: wg_status
  - platform: bosch_ebike_ldi
    bosch_ebike_ldi_id: ebike_bridge
    connected:
      name: "eBike Connected"
      id: connected_sensor
    light:
      name: "eBike Light"
      id: light_sensor
    system_locked:
      name: "eBike System Locked"
      id: system_locked_sensor
    charger_connected:
      name: "eBike Charger Connected"
      id: charger_conn
      on_state:
        - lambda: |-
            id(chg_rate) = -1;
            id(chg_last_soc) = -1;
            id(chg_last_ms) = millis();
    light_reserve:
      name: "eBike Light Reserve"
      id: light_reserve_sensor
    diagnosis_active:
      name: "eBike Diagnosis Active"
      id: diagnosis_active_sensor
    in_motion:
      name: "eBike In Motion"
      id: in_motion_sensor

switch:
  # Master advertising toggle (Issue #36). Off = the bridge only advertises
  # during a pairing window (boot 5 min / button) and is otherwise fully
  # silent (no background reconnect). Default on. Boot window is unaffected.
  - platform: template
    name: "eBike Advertising"
    icon: mdi:bluetooth
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      - lambda: 'id(ebike_bridge).set_advertising_enabled(true);'
    turn_off_action:
      - lambda: 'id(ebike_bridge).set_advertising_enabled(false);'

button:
  # Open the pairing window (~5 min): the bridge becomes discoverable so the
  # Flow app can add it. Outside the window it advertises privately and is NOT
  # visible to other users' Flow apps. One bridge per bike. (Issue #36)
  - platform: template
    name: "eBike Pairing starten"
    icon: mdi:bluetooth-connect
    on_press:
      then:
        - lambda: 'id(ebike_bridge).start_pairing();'
  # Register the Android app: the next new device that connects within ~5 min
  # becomes the phone. Closes the bike pairing window.
  - platform: template
    name: "eBike Pair phone"
    icon: mdi:cellphone-link
    on_press:
      then:
        - lambda: 'id(ebike_bridge).start_phone_pairing();'
  - platform: template
    name: "eBike Clear Bonding"
    on_press:
      then:
        - lambda: |-
            id(ebike_bridge).clear_bonding();
